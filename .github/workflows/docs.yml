name: Deploy FORD documentation to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - docs.md
      - README.md
      - src/**
      - pages/**
      - media/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz

      - name: Install FORD
        run: python -m pip install FORD==7.0.13

      - name: Build documentation
        run: make docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check documentation artifact size
        shell: bash
        run: |
          site_size_kib=$(du -sk _site | cut -f1)
          if (( site_size_kib > 20480 )); then
            echo "Documentation site is ${site_size_kib} KiB; limit is 20480 KiB."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
